name: Update latest Medium posts

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest posts from Medium
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@sean1093"
          max_post_count: 3
          date_format: "yyyy-MM-dd"
          template: "- [$title]($url) · $date$newline"
          commit_message: "chore: update latest Medium posts"
